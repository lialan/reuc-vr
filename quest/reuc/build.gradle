apply plugin: 'com.android.application'

// Resident Evil: The Umbrella Chronicles VR for Meta Quest (gse-recomp's quest/hotd4/build.gradle for this game). scripts/build-quest.sh
// fills src/main/libs, src/main/assets and src/main/sdl-java (SDL3's Java sources) before this runs.
android {
    namespace "org.uc.umbrellachronicles"
    compileSdkVersion 35

    defaultConfig {
        applicationId "org.uc.umbrellachronicles.vr"
        minSdkVersion 29
        targetSdkVersion 32
        versionCode((project.findProperty("appVersionCode") ?: "1") as int)
        versionName(project.findProperty("appVersionName") ?: "0.1.0")
        // the SHA-256 of the main.dol the game's code was translated from (scripts/build-quest.sh)
        resValue("string", "dol_sha256", project.findProperty("dolSha256") ?: "")
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lintOptions { abortOnError false }

    sourceSets.main {
        jni.srcDirs = []
        jniLibs.srcDir 'src/main/libs'
        java.srcDir 'src/main/sdl-java'
    }

    packaging {
        jniLibs { useLegacyPackaging = true }
    }
    signingConfigs {
        // Local builds sign with this machine's debug key, as HOTD4's local builds; UC_KEYSTORE for a project key.
        release {
            def ks = System.getenv("UC_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("UC_KEYSTORE_PASSWORD")
                keyAlias "uc"
                keyPassword System.getenv("UC_KEYSTORE_PASSWORD")
            } else {
                storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
